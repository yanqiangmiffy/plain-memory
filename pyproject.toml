[project]
name = "plain-memory"
version = "0.1.0"
description = "A small synchronous Add/Search memory service for AML."
requires-python = ">=3.11"
dependencies = [
  "faiss-cpu>=1.12,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pystemmer>=3.1.0",
  "PyYAML>=6,<7",
  "tiktoken>=0.9,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
plain-memory = "plain_memory.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
 "ruff>=0.11,<1",
 "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501", "E402", "I001"]
"src/plain_memory/enrich.py" = ["E501"]
"src/plain_memory/timeparse.py" = ["E501"]
"src/plain_memory/intent.py" = ["E501"]
"src/plain_memory/feedback.py" = ["E501"]
